<!DOCTYPE html>
<html lang="it">
<head>
    <title>eCommerce - Prodotti</title>
    <!-- Link al font Orbitron utilizzato per il titolo -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Stili globali per il body della pagina */
        body {
            font-family: Arial, sans-serif; /* Font di default */
            background-color: #000; /* Sfondo nero */
            color: #fff; /* Testo bianco */
            margin: 0;
            padding: 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Altezza minima per occupare tutta la schermata */
        }

        /* Stili per l'intestazione (header) */
        header {
            font-family: 'Orbitron', sans-serif; /* Font Orbitron per il titolo */
            background-color: #c81c22; /* Colore rosso per l'intestazione */
            color: #fff; /* Testo bianco */
            padding: 20px;
            font-size: 30px;
            font-weight: bold;
            display: flex;
            justify-content: space-between; /* Allinea gli elementi ai lati opposti */
            align-items: center; /* Allinea verticalmente gli elementi */
        }

        header h1 {
            margin: 0;
            font-size: 32px; /* Dimensione del font del titolo */
        }

        /* Stili per i pulsanti */
        button {
            background-color: #c81c22; /* Colore di sfondo rosso per i pulsanti */
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-left: 10px;
            transition: background-color 0.3s, transform 0.2s; /* Transizione di colore e ingrandimento al passaggio del mouse */
        }

        button:hover {
            background-color: #9b1620; /* Colore rosso più scuro al passaggio del mouse */
            transform: scale(1.05); /* Ingrandisce leggermente il pulsante */
        }

        /* Stili per la griglia dei prodotti */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); /* Imposta una griglia responsiva che si adatta alla larghezza della finestra */
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: auto;
            flex-grow: 1; /* Permette alla griglia di crescere in base allo spazio disponibile */
        }

        /* Stili per ogni prodotto */
        .product {
            background-color: #222; /* Colore di sfondo per il prodotto */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Aggiunge un'ombra per dare un effetto di profondità */
            transition: transform 0.3s, box-shadow 0.3s; /* Transizione per l'effetto di ingrandimento e cambio ombra */
        }

        .product:hover {
            transform: scale(1.05); /* Ingrandisce il prodotto al passaggio del mouse */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3); /* Aumenta l'ombra per enfatizzare l'interazione */
        }

        .product img {
            width: 100%; /* Imposta l'immagine per occupare tutta la larghezza del contenitore */
            height: auto; /* Mantiene il rapporto di aspetto dell'immagine */
            border-radius: 5px; /* Angoli arrotondati per l'immagine */
            margin-bottom: 15px; /* Spazio sotto l'immagine */
        }

        .product h3 {
            font-size: 20px;
            color: #c81c22; /* Colore del nome del prodotto */
            margin-bottom: 10px;
        }

        .product p {
            color: #bbb; /* Colore del testo della descrizione */
            font-size: 14px;
        }

        .product .price {
            font-weight: bold;
            color: #c81c22; /* Colore del prezzo */
            font-size: 18px;
            margin-top: 10px;
        }

        /* Stili per la sezione del footer */
        #footer-info {
            background-color: #000; /* Sfondo nero per il footer */
            color: #fff; /* Testo bianco */
            padding: 40px 20px;
            text-align: center;
        }

        #about-us {
            background-color: #c81c22; /* Sfondo rosso per la sezione "Chi siamo" */
            color: #fff; /* Testo bianco */
            padding: 30px;
            border-radius: 10px;
            width: 80%;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3); /* Aggiunge ombra per la sezione */
            text-align: center;
        }

        #about-us h2 {
            font-size: 28px;
            color: #fff;
            margin-bottom: 15px;
        }

        #about-us p {
            font-size: 16px;
            margin-top: 10px;
        }

        /* Stile per il link di login */
        .registration-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 16px;
            color: #c81c22; /* Colore rosso per il link */
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease; /* Transizione al passaggio del mouse */
        }

        .registration-link:hover {
            color: #9b1620; /* Colore rosso più scuro al passaggio del mouse */
        }

        .clear-btn {
            margin: 20px auto;
        }
    </style>
</head>
<body>

<!-- Intestazione della pagina -->
<header>
    <h1>NEO-Moto</h1>
    <div>
        <!-- Pulsanti di navigazione -->
        <button onclick="window.location.href='carrello.html'">Carrello</button>
        <button onclick="window.location.href='contatti.html'">Contattaci</button>
        <button onclick="logout()">Esci</button>
    </div>
</header>

<main>
    <!-- Griglia per la visualizzazione dei prodotti -->
    <div id="product-list" class="product-grid"></div>
    <!-- Input per caricare un file JSON contenente i prodotti -->
    <input type="file" id="jsonFileInput" accept=".json" />
    <br>
    <!-- Pulsante per svuotare i prodotti salvati -->
    <button class="clear-btn" onclick="clearSavedProducts()">Svuota Prodotti</button>
</main>

<!-- Sezione Footer con informazioni -->
<section id="footer-info">
    <div id="about-us">
        <h2>Chi Siamo</h2>
        <p>Benvenuti nel nostro negozio online! Siamo un team di appassionati di motociclette ad alte prestazioni...</p>
    </div>
    <footer>
        <p>&copy; 2025 Negozio Online - Tutti i diritti riservati</p>
        <p>Informazioni legali | Termini e condizioni</p>
    </footer>
</section>

<!-- Link per il login -->
<a href="login.html" class="registration-link" id="loginLink">Login</a>

<script>
    // Verifica se l'utente è loggato e aggiorna il link di login
    document.addEventListener("DOMContentLoaded", function () {
        const user = JSON.parse(localStorage.getItem('loggedInUser'));
        const loginLink = document.getElementById('loginLink');

        if (user) {
            // Se l'utente è loggato, mostra un messaggio di benvenuto
            loginLink.textContent = `Benvenuto, ${user.username}`;
            loginLink.href = "#"; // Impedisce il reindirizzamento
            loginLink.addEventListener('click', logout); // Aggiungi l'evento di logout
        } else {
            loginLink.textContent = 'Login'; // Se non è loggato, mostra "Login"
        }
    });

    // Funzione per eseguire il logout
    function logout() {
        localStorage.removeItem('loggedInUser'); // Rimuove l'utente dal localStorage
        location.reload(); // Ricarica la pagina per aggiornare lo stato
    }

    // Carica i prodotti dal localStorage o dal file JSON caricato
    document.addEventListener("DOMContentLoaded", function () {
        const fileInput = document.getElementById("jsonFileInput");
        const productList = document.getElementById("product-list");

    // Se ci sono prodotti salvati nel localStorage, li carica
    const savedProducts = localStorage.getItem("productList");
    if (savedProducts) {
        try {
            const products = JSON.parse(savedProducts);
            displayProducts(products);
        } catch (error) {
            console.error("Errore nel parsing del JSON salvato:", error);
        }
    }

    // Gestisce il caricamento di un file JSON
    fileInput.addEventListener("change", function (event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const products = JSON.parse(e.target.result); // Parsea il file JSON
                    localStorage.setItem("productList", JSON.stringify(products)); // Salva i prodotti nel localStorage
                    displayProducts(products); // Mostra i prodotti sulla pagina
                } catch (error) {
                    console.error("Errore nel parsing del JSON:", error);
                }
            };
            reader.readAsText(file);
        }
    });

    // Funzione per mostrare i prodotti nella griglia
    function displayProducts(products) {
        productList.innerHTML = ""; // Pulisce la griglia
        products.forEach(product => {
            const productElement = document.createElement("div");
            productElement.classList.add("product");
            productElement.innerHTML = `
                <img src="${product.image}" alt="${product.name}">
                <h3>${product.name}</h3>
                <p class="price">${product.price}</p>
                <button class="add-to-cart-btn">Aggiungi al Carrello</button>
            `;

            // Aggiunge evento al pulsante per il carrello
            productElement.querySelector('.add-to-cart-btn').addEventListener('click', () => {
                addToCart(product);
            });

            // Al clic sull'intera card, salva il prodotto e apre la pagina dettagli
            productElement.addEventListener("click", () => {
                localStorage.setItem("selectedProduct", JSON.stringify(product));
                window.location.href = "prodotto.html"; 
            });

            productList.appendChild(productElement);
        });
    }

    // Aggiunge un prodotto al carrello
    function addToCart(product) {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        cart.push(product);
        localStorage.setItem("cart", JSON.stringify(cart));
    }

    // Funzione globale per svuotare i prodotti
    window.clearSavedProducts = function () {
        localStorage.removeItem("productList");
        location.reload(); // Ricarica la pagina
    };
});

</script> </body> </html>
